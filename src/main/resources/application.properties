# Healthcare Management System — Application Configuration
# Database: Uses environment variables for production (MySQL), H2 for testing

# Database connection (from environment variables, or H2 default)
spring.datasource.url=${DB_URL:jdbc:h2:mem:healthcare_db}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 console (only for local H2 development, disabled for MySQL)
spring.h2.console.enabled=${H2_CONSOLE:false}

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Hibernate dialect: auto-detect based on driver
# (MySQL will use MySQL8Dialect automatically, H2 uses H2Dialect)
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# SQL initialization (disabled by default; use db/schema.sql and db/seed_data.sql manually)
spring.sql.init.mode=never

# Thymeleaf (cache disabled for dev, should be enabled in production)
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Server port (respects $PORT for Render, defaults to 8080)
server.port=${PORT:8080}
